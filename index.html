<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Gem T Abaddon</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            background-color: black;
            color: white;
            margin: 0;
            font-family: Arial, sans-serif;
            text-align: center;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .main-page {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 40px;
        }

        .title-area {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 50px;
        }

        .title-image {
            width: 100px;
            height: 100px;
            object-fit: contain;
        }

        h1 {
            margin: 0;
            font-size: 42px;
        }

        h2 {
            margin: 8px 0 0;
            font-weight: normal;
            font-size: 20px;
        }

        .menus {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 35px;
            width: 100%;
        }

        .menus a {
            display: block;
            width: 30%;
            max-width: 600px;
        }

        .menus img {
            width: 100%;
            display: block;
            cursor: pointer;
            transition: transform 0.25s ease;
        }

        .menus img:hover {
            transform: scale(1.05);
        }

        .musica {
            position: fixed;
            top: 25px;
            right: 30px;
        }
    </style>
</head>

<body>

    <div class="main-page">

        <div class="musica">
            🎵 Música
        </div>

        <div class="title-area">

            <img src="logo.png" class="title-image" alt="Logo">

            <div>
                <h1>Gem T Abaddon</h1>
                <h2>Numbers and language</h2>
            </div>

        </div>

        <div class="menus">

            <a href="menu1.html">
                <img src="1.png" alt="Menu 1">
            </a>

            <a href="menu2.html">
                <img src="2.png" alt="Menu 2">
            </a>

            <a href="menu3.html">
                <img src="3.png" alt="Menu 3">
            </a>

        </div>

    </div>

</body>

</html>
